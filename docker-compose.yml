services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nottex-frontend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - "${TLS_CERTIFICATE_PATH:?Set TLS_CERTIFICATE_PATH to the full-chain certificate file}:/etc/nginx/certs/fullchain.pem:ro"
      - "${TLS_PRIVATE_KEY_PATH:?Set TLS_PRIVATE_KEY_PATH to the private key file}:/etc/nginx/certs/privkey.pem:ro"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nottex-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nottex-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    expose:
      - "8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: mongodb://nottex_app:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD to a random hex value}@mongodb:27017/?authSource=admin
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a cryptographically random secret}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?Set TOTP_ENCRYPTION_KEY to a generated Fernet key and keep it stable}
      NOTE_ENCRYPTION_KEY: ${NOTE_ENCRYPTION_KEY:?Set NOTE_ENCRYPTION_KEY to a generated Fernet key and keep it stable}
      SSE_MAX_CONNECTIONS_PER_PROCESS: ${SSE_MAX_CONNECTIONS_PER_PROCESS:-100}
      SSE_MAX_CONNECTIONS_PER_USER: ${SSE_MAX_CONNECTIONS_PER_USER:-5}
      SSE_QUEUE_MAX_SIZE: ${SSE_QUEUE_MAX_SIZE:-8}
      SSE_MAX_EVENT_BYTES: ${SSE_MAX_EVENT_BYTES:-32768}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL to the public application URL}
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:?Set CORS_ALLOW_ORIGINS to a JSON array of explicit HTTPS origins}"
      EMAILS_ENABLED: ${EMAILS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST to your production SMTP provider}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?Set SMTP_USER for your production SMTP provider}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD for your production SMTP provider}
      SMTP_TLS: ${SMTP_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@nottex.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Nottex}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - nottex-network

  mongodb:
    image: mongo:8.0
    container_name: nottex-mongodb
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-nottex_root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD to a random secret}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD to a random hex value}
    volumes:
      - mongodb_data:/data/db
      - ./deploy/mongo-init/01-create-app-user.sh:/docker-entrypoint-initdb.d/01-create-app-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nottex-network

networks:
  nottex-network:
    driver: bridge

volumes:
  mongodb_data:
    name: ${MONGODB_VOLUME_NAME:-nottex_mongodb_data}
